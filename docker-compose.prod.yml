services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colab-be.bnitech.online
    restart: always
    ports:
      - "3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL}
      - PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/api/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      coolify:
        aliases:
          - colab-be.bnitech.online

networks:
  coolify:
    name: coolify
    driver: bridge
    external: true
