services:
  colab-db-dev.bnitech.online:
    image: postgres:16-alpine
    container_name: colab-db-dev.bnitech.online
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bni_colab}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_colab_dev:/var/lib/postgresql/data

  colab-be-dev.bnitech.online:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colab-be-dev.bnitech.online
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DB_HOST=${DB_HOST:-colab-db-dev.bnitech.online}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DATABASE=${DB_DATABASE:-bni_colab}
      - JWT_SECRET=${JWT_SECRET:-dev_secret_key_12345}
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL:-http://localhost:3002}
      - PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL:-http://localhost:4322}
    depends_on:
      - colab-db-dev.bnitech.online

volumes:
  pgdata_colab_dev:
